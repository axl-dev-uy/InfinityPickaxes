name: InfinityGear
version: '${version}'
main: com.infinitygear.InfinityGearPlugin
api-version: '26.2'
author: aland
description: Persistent profile-driven levelable gear with safe enchantment stations and duplicate quarantine.
provides: [InfinityPickaxes]
depend: [EcoEnchants, eco]
softdepend: [PlaceholderAPI, WorldGuard, Vault, Nexo]
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.6

commands:
  infinitygear:
    description: Main command for InfinityGear
    aliases: [igear]
    permission: infinitygear.use
    usage: /<command> [give|artifact|reload|setlevel|addxp|station|duplicate|migration]
  infinitypickaxes:
    description: Deprecated InfinityPickaxes compatibility command
    aliases: [ipickaxe, infinitypickaxe]
    permission: infinitypickaxes.use
    usage: /<command> [give|reload|setlevel|addxp|gui|duplicate]

permissions:
  infinitygear.use: {default: true}
  infinitygear.admin:
    default: op
    children:
      infinitygear.admin.give: true
      infinitygear.admin.artifact: true
      infinitygear.admin.reload: true
      infinitygear.admin.setlevel: true
      infinitygear.admin.addxp: true
      infinitygear.admin.station: true
      infinitygear.admin.migration: true
      infinitygear.admin.duplicates.view: true
      infinitygear.admin.duplicates.scan: true
      infinitygear.admin.duplicates.quarantine: true
      infinitygear.admin.duplicates.resolve: true
      infinitygear.use: true
  infinitygear.admin.give: {default: op}
  infinitygear.admin.artifact: {default: op}
  infinitygear.admin.reload: {default: op}
  infinitygear.admin.setlevel: {default: op}
  infinitygear.admin.addxp: {default: op}
  infinitygear.admin.station: {default: op}
  infinitygear.admin.migration: {default: op}
  infinitygear.admin.duplicates.view: {default: op}
  infinitygear.admin.duplicates.scan: {default: op}
  infinitygear.admin.duplicates.quarantine: {default: op}
  infinitygear.admin.duplicates.resolve: {default: op}
  infinitygear.station.runic-table.bypass: {default: op}
  infinitygear.station.fusion-altar.bypass: {default: op}
  infinitygear.station.gear-forge.bypass: {default: op}

  # Compatibility permissions retained for existing groups and dependents.
  infinitypickaxes.use: {default: true}
  infinitypickaxes.admin:
    default: op
    children:
      infinitypickaxes.admin.duplicates.view: true
      infinitypickaxes.admin.duplicates.scan: true
      infinitypickaxes.admin.duplicates.quarantine: true
      infinitypickaxes.admin.duplicates.resolve: true
      infinitypickaxes.use: true
      infinitygear.admin: true
  infinitypickaxes.admin.duplicates.view: {default: op}
  infinitypickaxes.admin.duplicates.scan: {default: op}
  infinitypickaxes.admin.duplicates.quarantine: {default: op}
  infinitypickaxes.admin.duplicates.resolve: {default: op}
